<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Chibi Xue Zhenzhu: tight perm, scowl, mid-shout, pearl earrings, green coat -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffe17d"/>
      <stop offset="1" stop-color="#f2b329"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffeadb"/>
      <stop offset="1" stop-color="#f1c4a6"/>
    </radialGradient>
    <radialGradient id="pearl" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#f1ebe0"/>
      <stop offset="1" stop-color="#c7bca9"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- green coat, maroon top -->
  <path d="M6 64 C8 55.5 16.5 51.5 25 50.8 L39 50.8 C47.5 51.5 56 55.5 58 64 Z" fill="#1f6b52"/>
  <path d="M25.5 50.8 L32 59 L38.5 50.8 Z" fill="#7a1f2e"/>
  <path d="M25 50.8 L31 60.5 M39 50.8 L33 60.5" stroke="#2c8a6a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- perm: a crown of tight curls -->
  <g fill="#231e26">
    <ellipse cx="32" cy="30.5" rx="14.5" ry="13"/>
    <circle cx="18.4" cy="31.5" r="5.4"/>
    <circle cx="19.5" cy="26.2" r="5.4"/>
    <circle cx="22.6" cy="21.7" r="5.4"/>
    <circle cx="27.1" cy="18.8" r="5.4"/>
    <circle cx="32.5" cy="17.9" r="5.4"/>
    <circle cx="37.7" cy="19.2" r="5.4"/>
    <circle cx="42.1" cy="22.4" r="5.4"/>
    <circle cx="44.9" cy="27.1" r="5.4"/>
    <circle cx="45.6" cy="31.5" r="5.4"/>
    <circle cx="19" cy="37.4" r="5"/>
    <circle cx="45" cy="37.4" r="5"/>
  </g>
  <g fill="none" stroke="#4d4456" stroke-width="1.1" stroke-linecap="round">
    <path d="M16.1 25.6 a3.6 3.6 0 0 1 3.6-3.2"/>
    <path d="M19.2 21.1 a3.6 3.6 0 0 1 3.6-3.2"/>
    <path d="M23.7 18.2 a3.6 3.6 0 0 1 3.6-3.2"/>
    <path d="M29.1 17.3 a3.6 3.6 0 0 1 3.6-3.2"/>
    <path d="M34.3 18.6 a3.6 3.6 0 0 1 3.6-3.2"/>
    <path d="M38.7 21.8 a3.6 3.6 0 0 1 3.6-3.2"/>
    <path d="M41.5 26.5 a3.6 3.6 0 0 1 3.6-3.2"/>
  </g>

  <!-- face -->
  <rect x="28" y="44" width="8" height="9" rx="3" fill="#e9b899"/>
  <ellipse cx="32" cy="36.8" rx="12.6" ry="12.8" fill="url(#skin)"/>
  <!-- bangs -->
  <g fill="#231e26">
    <circle cx="21.8" cy="25.9" r="4.2"/>
    <circle cx="26.8" cy="23.8" r="4.2"/>
    <circle cx="32" cy="23.2" r="4.2"/>
    <circle cx="37.2" cy="23.8" r="4.2"/>
    <circle cx="42.2" cy="25.9" r="4.2"/>
  </g>

  <!-- fierce brows, glaring eyes -->
  <g stroke="#231e26" stroke-width="2.5" stroke-linecap="round">
    <path d="M22.6 31.6 L28.6 33.6"/>
    <path d="M41.4 31.6 L35.4 33.6"/>
  </g>
  <path d="M23.6 35.2 q2.4-2 4.8 0" stroke="#8b6fc4" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".85"/>
  <path d="M35.6 35.2 q2.4-2 4.8 0" stroke="#8b6fc4" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".85"/>
  <ellipse cx="26" cy="37" rx="1.7" ry="2.1" fill="#231e26"/>
  <ellipse cx="38" cy="37" rx="1.7" ry="2.1" fill="#231e26"/>
  <circle cx="26.6" cy="36.2" r=".6" fill="#fff"/>
  <circle cx="38.6" cy="36.2" r=".6" fill="#fff"/>
  <ellipse cx="22" cy="42" rx="2.8" ry="1.6" fill="#ef8a86" opacity=".55"/>
  <ellipse cx="42" cy="42" rx="2.8" ry="1.6" fill="#ef8a86" opacity=".55"/>
  <ellipse cx="32" cy="40.6" rx="1.2" ry=".9" fill="#e3a98c"/>
  <!-- mid-shout -->
  <ellipse cx="32" cy="44.8" rx="3" ry="2.5" fill="#8a1a29" stroke="#d3283b" stroke-width="1.5"/>

  <!-- pearl earrings -->
  <circle cx="18.6" cy="44.2" r="2.4" fill="url(#pearl)"/>
  <circle cx="45.4" cy="44.2" r="2.4" fill="url(#pearl)"/>
</svg>
